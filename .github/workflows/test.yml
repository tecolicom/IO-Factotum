name: test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl:
          [
            "5.42",
            "5.40",
            "5.38",
            "5.36",
            "5.34",
            "5.32",
            "5.30",
            "5.28",
            "5.26",
            "5.24",
            "5.22",
            "5.20",
            "5.18",
            "5.16",
          ]
    name: Perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Install dependencies
        run: cpanm -nq --metacpan --installdeps --with-develop --with-recommends .
      # for t/03_skylighting.t and t/05_sourcehighlight.t, which are
      # skipped without the commands
      - name: Install highlighters
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q skylighting source-highlight
          skylighting --version
          source-highlight --version | head -1
      - name: Run test
        run: prove -lr t

